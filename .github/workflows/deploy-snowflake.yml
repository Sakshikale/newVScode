

name: Deploy Snowflake SQL
 
on:

  push:

    branches:

      - main

    paths:

      - "sql/**"

      - ".github/workflows/deploy-snowflake.yml"

  workflow_dispatch:
 
permissions:

  contents: read
 
jobs:

  deploy:

    runs-on: ubuntu-latest
 
    steps:

      - name: Checkout repository

        uses: actions/checkout@v4
 
      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"
 
      - name: Install Snowflake CLI

        run: pip install snowflake-cli
 
      - name: Configure Snowflake connection

        env:

          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}

          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}

          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}

        run: |

          snow connection add \

            --connection-name ci \

            --account "$SNOWFLAKE_ACCOUNT" \

            --user "$SNOWFLAKE_USER" \

            --password "$SNOWFLAKE_PASSWORD" \

            --role ACCOUNTADMIN \

            --warehouse PIPELINE_WH \

            --database RETAIL_DB \

            --schema RAW \

            --no-interactive
 
      - name: Test Snowflake connection

        run: |

          snow sql --connection ci \

            --query "SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_WAREHOUSE();"
 
      - name: Deploy Snowflake objects

        run: |

          snow sql --connection ci \

            --filename sql/01_create_objects.sql
 
      - name: Deploy Snowflake objects

        run: |

          snow sql --connection ci \

            --filename sql/02_create_views.sql
 
   
 